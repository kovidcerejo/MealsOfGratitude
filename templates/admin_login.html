{% extends "layout.html" %}
{% from "components/ui.html" import page_header %}

{% block title %}Admin sign in | Meals of Gratitude{% endblock %}
{% block page_class %}narrow-page{% endblock %}

{% block body %}
    {{ page_header('Admin sign in', '', "/", "Home") }}
    <form action="/admin/login" method="POST" class="form-panel" id="admin-form">
        <label for="admin-pw" class="form-label">Admin Password</label>
        <input type="password" name="pw" autofocus autocomplete="off" class="form-control mb-3" id="admin-pw" required>
        <button type="submit" class="btn btn-primary">Sign in</button>
    </form>
{% endblock %}
