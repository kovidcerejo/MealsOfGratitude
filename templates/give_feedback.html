{% extends "layout.html" %}
{% from "components/ui.html" import page_header %}

{% block title %}Give feedback | Meals of Gratitude{% endblock %}
{% block page_class %}narrow-page{% endblock %}

{% block body %}
    {{ page_header('Give feedback', '', '/teachers/', 'Staff portal') }}
    <form class="form-panel" action="/teachers/give-feedback" method="POST" id="upload-recipe">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" name="name" required placeholder="Name" id="name" class="form-control" autocomplete="name">
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" name="email" required placeholder="Email" id="email" class="form-control" autocomplete="email">
        </div>
        <div class="mb-3">
            <label for="feedback" class="form-label">Feedback</label>
            <textarea id="feedback" class="form-control" name="feedback" placeholder="Feedback" required rows="5"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit feedback</button>
    </form>
{% endblock %}
